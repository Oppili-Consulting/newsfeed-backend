name: Refresh news posts

on:
  schedule:
    # Public repositories get unlimited Actions minutes, so the feed can be rebuilt often.
    # GitHub's scheduler can lag under load, so fifteen minutes is a reliable target rather
    # than a guarantee; the app also reads feeds directly on the device when asked to.
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Read every feed and write the JSON API
        run: python scripts/fetch_posts.py --contact "${{ vars.CONTACT_EMAIL || 'oppili-consulting@users.noreply.github.com' }}"

      # enablement: true lets the workflow turn GitHub Pages on by itself the first
      # time it runs, so no manual trip to Settings is needed.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
